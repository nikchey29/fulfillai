name: cloudops-validation

on:
  push:
    branches: [main, feat/cloudops-platform]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt
        run: terraform -chdir=infra/gcp/terraform fmt -recursive
      - name: Terraform init
        run: terraform -chdir=infra/gcp/terraform init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infra/gcp/terraform validate

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint deploy/helm/fulfillai
      - name: Helm render
        run: |
          helm template fulfillai deploy/helm/fulfillai \
            --namespace fulfillai \
            --set image.repository=example.invalid/fulfillai-api \
            --set image.tag=${{ github.sha }} >/tmp/fulfillai-rendered.yaml

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: fulfillai-api:${{ github.sha }}
