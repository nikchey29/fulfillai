name: cloudops-validation

on:
  push:
    branches:
      - main
      - platform-engineering-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  GCP_PROJECT_ID: "argon-tuner-396010"
  GCP_REGION: "europe-west3"
  GKE_CLUSTER: "fulfillai-gke"
  GAR_REPOSITORY: "fulfillai"
  WIF_PROVIDER: "projects/1089042319319/locations/global/workloadIdentityPools/fulfillai-github/providers/github"
  GCP_DEPLOYER_SA: "fulfillai-github-deployer@argon-tuner-396010.iam.gserviceaccount.com"

jobs:
  source:
    name: Source tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Verify source contracts
        run: python scripts/verify_source.py
      - name: Tests
        run: python -m pytest -q

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform format gate
        run: terraform -chdir=infra/gcp/terraform fmt -check -recursive
      - name: Terraform init without backend
        run: terraform -chdir=infra/gcp/terraform init -backend=false -input=false
      - name: Terraform validate
        run: terraform -chdir=infra/gcp/terraform validate

  helm:
    name: Helm validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint deploy/helm/fulfillai
      - name: Helm render
        run: |
          helm template fulfillai deploy/helm/fulfillai \
            --namespace fulfillai \
            --set image.repository=example.invalid/fulfillai-api \
            --set image.tag=${{ github.sha }} >/tmp/fulfillai-rendered.yaml
          test -s /tmp/fulfillai-rendered.yaml

  container:
    name: Container build and security scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          load: true
          tags: fulfillai-api:${{ github.sha }}
      - name: Trivy HIGH and CRITICAL gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fulfillai-api:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
      - name: Authenticate to Google Cloud for image publishing
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}
      - name: Setup gcloud for image publishing
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Publish verified image to Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/platform-engineering-v2'
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY="${GCP_REGION}-docker.pkg.dev"
          IMAGE_URI="${REGISTRY}/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/fulfillai-api"
          gcloud auth configure-docker "${REGISTRY}" --quiet
          docker tag "fulfillai-api:${GITHUB_SHA}" "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE_URI}:${GITHUB_SHA}" --format='value(image_summary.digest)')"
          test -n "${DIGEST}"
          case "${DIGEST}" in
            sha256:*) ;;
            *) echo "Invalid digest: ${DIGEST}"; exit 1 ;;
          esac
          echo "PUBLISHED_IMAGE=${IMAGE_URI}:${GITHUB_SHA}"
          echo "PUBLISHED_DIGEST=${DIGEST}"
          echo "PUBLISHED_IMMUTABLE=${IMAGE_URI}@${DIGEST}"

  cloud-identity:
    name: Keyless GCP identity smoke test
    if: github.event_name == 'push'
    needs:
      - source
      - terraform
      - helm
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Verify federated identity and read-only delivery targets
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          test "$ACTIVE_ACCOUNT" = "$GCP_DEPLOYER_SA"
          gcloud artifacts repositories describe "$GAR_REPOSITORY" --location="$GCP_REGION" --project="$GCP_PROJECT_ID" --format='value(name)' >/dev/null
          gcloud container clusters describe "$GKE_CLUSTER" --region="$GCP_REGION" --project="$GCP_PROJECT_ID" --format='value(name)' >/dev/null
          echo "KEYLESS_GCP_IDENTITY=PASS"

  gitops-delivery:
    name: GitOps promote and verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/platform-engineering-v2'
    needs:
      - source
      - terraform
      - helm
      - container
      - cloud-identity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout delivery branch
        uses: actions/checkout@v7
        with:
          ref: platform-engineering-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Resolve immutable image and reject stale promotion
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin platform-engineering-v2 --quiet
          REMOTE_SHA="$(git rev-parse origin/platform-engineering-v2)"
          test "${REMOTE_SHA}" = "${GITHUB_SHA}"
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/fulfillai-api"
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE_URI}:${GITHUB_SHA}" --project="${GCP_PROJECT_ID}" --format='value(image_summary.digest)')"
          case "${DIGEST}" in
            sha256:*) ;;
            *) echo "Invalid digest: ${DIGEST}"; exit 1 ;;
          esac
          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "immutable=${IMAGE_URI}@${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Update and validate GitOps desired state
        env:
          IMAGE_URI: ${{ steps.artifact.outputs.image_uri }}
          DIGEST: ${{ steps.artifact.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E "s|^  repository:.*|  repository: ${IMAGE_URI}|" deploy/helm/fulfillai/values-gitops.yaml
          sed -i -E "s|^  tag:.*|  tag: ${GITHUB_SHA}|" deploy/helm/fulfillai/values-gitops.yaml
          sed -i -E "s|^  digest:.*|  digest: ${DIGEST}|" deploy/helm/fulfillai/values-gitops.yaml
          git diff --check
          CHANGED="$(git diff --name-only)"
          test "${CHANGED}" = "deploy/helm/fulfillai/values-gitops.yaml"
          helm lint deploy/helm/fulfillai -f deploy/helm/fulfillai/values-gitops.yaml
          helm template fulfillai deploy/helm/fulfillai --namespace fulfillai -f deploy/helm/fulfillai/values-gitops.yaml >/tmp/fulfillai-gitops-render.yaml
          grep -F "${IMAGE_URI}@${DIGEST}" /tmp/fulfillai-gitops-render.yaml >/dev/null

      - name: Commit desired state
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin platform-engineering-v2 --quiet
          REMOTE_SHA="$(git rev-parse origin/platform-engineering-v2)"
          test "${REMOTE_SHA}" = "${GITHUB_SHA}"
          git add deploy/helm/fulfillai/values-gitops.yaml
          git diff --cached --check
          if git diff --cached --quiet; then
            DELIVERY_SHA="$(git rev-parse HEAD)"
          else
            git commit -m "chore(gitops): promote ${GITHUB_SHA:0:12}"
            DELIVERY_SHA="$(git rev-parse HEAD)"
            git push origin HEAD:platform-engineering-v2
          fi
          echo "delivery_sha=${DELIVERY_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Wait for GitOps rollout
        env:
          TARGET_IMAGE: ${{ steps.artifact.outputs.immutable }}
          DELIVERY_SHA: ${{ steps.promote.outputs.delivery_sha }}
        shell: bash
        run: |
          set -euo pipefail
          PASS=NO
          for i in $(seq 1 120); do
            LIVE_IMAGE="$(kubectl -n fulfillai get deployment fulfillai -o jsonpath='{.spec.template.spec.containers[?(@.name=="fulfillai")].image}' 2>/dev/null || true)"
            DESIRED="$(kubectl -n fulfillai get deployment fulfillai -o jsonpath='{.spec.replicas}' 2>/dev/null || true)"
            UPDATED="$(kubectl -n fulfillai get deployment fulfillai -o jsonpath='{.status.updatedReplicas}' 2>/dev/null || true)"
            READY="$(kubectl -n fulfillai get deployment fulfillai -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)"
            AVAILABLE="$(kubectl -n fulfillai get deployment fulfillai -o jsonpath='{.status.availableReplicas}' 2>/dev/null || true)"
            DESIRED="${DESIRED:-0}"
            UPDATED="${UPDATED:-0}"
            READY="${READY:-0}"
            AVAILABLE="${AVAILABLE:-0}"
            if [ "${LIVE_IMAGE}" = "${TARGET_IMAGE}" ] && [ "${DESIRED}" -ge 2 ] && [ "${UPDATED}" -eq "${DESIRED}" ] && [ "${READY}" -eq "${DESIRED}" ] && [ "${AVAILABLE}" -eq "${DESIRED}" ]; then
              PASS=YES
              break
            fi
            sleep 5
          done
          test "${PASS}" = "YES"
          kubectl -n fulfillai rollout status deployment/fulfillai --timeout=60s
          POD_IMAGES="$(kubectl -n fulfillai get pods -l app.kubernetes.io/name=fulfillai -o jsonpath='{range .items[*]}{.spec.containers[0].image}{"\n"}{end}')"
          POD_COUNT="$(printf '%s\n' "${POD_IMAGES}" | sed '/^$/d' | wc -l | tr -d ' ')"
          MISMATCH="$(printf '%s\n' "${POD_IMAGES}" | awk -v target="${TARGET_IMAGE}" 'NF && $0 != target {n++} END {print n+0}')"
          test "${POD_COUNT}" -ge 2
          test "${MISMATCH}" -eq 0
          echo "GITOPS_DELIVERY=PASS"
          echo "SourceCommit=${GITHUB_SHA}"
          echo "DeliveryCommit=${DELIVERY_SHA}"
          echo "ImmutableImage=${TARGET_IMAGE}"
          echo "DesiredReplicas=${DESIRED}"
          echo "ReadyReplicas=${READY}"
          echo "Controller=ArgoCD"
          echo "DirectHelmUpgrade=NO"
          echo "DirectDeploymentPatch=NO"
