[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fulfillai"
version = "1.1.0"
description = "Synthetic e-commerce fulfillment system spanning data, ML, analytics, and streaming"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Chaithanya Vemuri"}]
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.5",
  "Faker==40.36.0",
  "PyYAML==6.0.3",
  "psycopg[binary]==3.3.4",
  "python-dotenv==1.2.3",
  "scikit-learn==1.9.0",
  "joblib==1.5.3",
  "pyarrow>=15.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1"]
mlops = ["mlflow-skinny==3.15.1"]
dbt = ["dbt-postgres>=1.8,<2"]
streaming = ["kafka-python-ng>=2.2,<3", "pyspark>=3.5,<4.1"]
platform = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "mlflow-skinny==3.15.1",
  "dbt-postgres>=1.8,<2",
  "kafka-python-ng>=2.2,<3",
  "pyspark>=3.5,<4.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src.fulfillai*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
