services:
  postgres:
    image: postgres:17
    container_name: fulfillai-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - fulfillai_postgres_data:/var/lib/postgresql/data
      - ./sql/schema/001_core_schema.sql:/docker-entrypoint-initdb.d/001_core_schema.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  fulfillai_postgres_data: