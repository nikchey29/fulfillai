seed: 42

simulation:
  start_date: "2025-08-01"
  end_date: "2026-07-31"

scale:
  customers: 5000
  categories: 12
  products: 300
  warehouses: 5
  target_orders: 50000

geography:
  countries:
    - US
    - DE
    - GB
    - CA

shipping:
  methods:
    standard: 0.70
    express: 0.23
    same_day: 0.07

orders:
  average_items_per_order: 2.2
  cancellation_rate: 0.035

demand:
  weekend_multiplier: 1.18
  holiday_multiplier: 1.55

products:
  popularity_distribution: zipf

inventory:
  initial_stock_min: 50
  initial_stock_max: 500
  reorder_point_min: 20
  reorder_point_max: 100

fulfillment:
  processing_hours:
    standard:
      min: 6
      max: 36
    express:
      min: 2
      max: 16
    same_day:
      min: 0.5
      max: 4

  transit_hours:
    standard:
      min: 48
      max: 120
    express:
      min: 24
      max: 72
    same_day:
      min: 2
      max: 10

  delivery_exception_rate: 0.045
  late_delivery_rate: 0.10

  # Delivery V2: structured synthetic risk.
  #
  # V1 sampled exception/late outcomes independently of every predictor,
  # which made leakage-safe modeling mathematically unable to outperform
  # the class prevalence. V2 preserves the same configured event rates but
  # makes risk depend on shipment-time information such as carrier, service
  # level, processing pressure, calendar effects and warehouse.
  delivery_risk_v2:
    enabled: true
    seed_offset: 9107
    exception_signal_scale: 1.70
    late_signal_scale: 1.35

    carrier_exception_effects:
      DHL: -0.55
      UPS: -0.25
      FedEx: 0.00
      DPD: 0.55
      GLS: 0.85

    carrier_late_effects:
      DHL: -0.35
      UPS: -0.15
      FedEx: 0.05
      DPD: 0.35
      GLS: 0.55

    shipping_method_exception_effects:
      standard: -0.15
      express: 0.15
      same_day: 0.70

    shipping_method_late_effects:
      standard: -0.25
      express: 0.15
      same_day: 0.90

    warehouse_effects:
      1: 0.25
      2: -0.15
      3: 0.10
      4: -0.10
      5: 0.20

    month_effects:
      1: 0.35
      2: 0.10
      6: 0.05
      7: 0.10
      11: 0.20
      12: 0.55

  carriers:
    DHL: 0.24
    UPS: 0.24
    FedEx: 0.22
    DPD: 0.16
    GLS: 0.14

  shipping_cost:
    standard:
      min: 3.50
      max: 9.00
    express:
      min: 8.00
      max: 18.00
    same_day:
      min: 15.00
      max: 30.00

# ---------------------------------------------------------
# Order lifecycle and event simulation
# ---------------------------------------------------------

lifecycle:

  cancellation_stages:
    pre_payment: 0.30
    post_payment: 0.30
    post_reservation: 0.40

  timing:

    payment_confirmation_minutes:
      min: 1
      max: 20

    inventory_reservation_minutes:
      min: 1
      max: 15

    processing_start_minutes:
      min: 5
      max: 45

    packing_hours:
      standard:
        min: 1
        max: 8
      express:
        min: 0.5
        max: 4
      same_day:
        min: 0.25
        max: 2

    shipment_creation_minutes:
      min: 10
      max: 60

    cancellation_delay_minutes:
      pre_payment:
        min: 1
        max: 15

      post_payment:
        min: 5
        max: 45

      post_reservation:
        min: 10
        max: 90

    inventory_release_minutes:
      min: 1
      max: 15

  event_source: synthetic_generator

  exception_reasons:
    carrier_delay: 0.35
    weather: 0.15
    address_issue: 0.15
    damaged_package: 0.10
    lost_package: 0.05
    warehouse_delay: 0.20
