apiVersion: v1
kind: ServiceAccount
metadata:
  name: fulfillai-ops-observer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fulfillai-ops-observer
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fulfillai-ops-observer
subjects:
  - kind: ServiceAccount
    name: fulfillai-ops-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fulfillai-ops-observer
