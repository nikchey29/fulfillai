apiVersion: v1
kind: Service
metadata:
  name: fulfillai
  labels:
    app.kubernetes.io/name: fulfillai
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: fulfillai
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
