apiVersion: v1
kind: ServiceAccount
metadata:
  name: fulfillai
  labels:
    app.kubernetes.io/name: fulfillai
  {{- if .Values.serviceAccount.gcpServiceAccount }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount | quote }}
  {{- end }}
automountServiceAccountToken: false
